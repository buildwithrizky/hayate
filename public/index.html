<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hayate</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <!-- Native Clean CSS -->
  <link rel="stylesheet" href="/vendor/xterm.css" />
  <link rel="stylesheet" href="/vendor/prism-vscode.css" />
  <link rel="stylesheet" href="/css/index.css" />
</head>
<body>
  <div id="app">
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-left">
        <button id="toggle-sidebar-btn" class="btn btn-icon" title="Toggle Sidebar (Cmd+B / Ctrl+B)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2"/>
            <path d="M9 3v18"/>
          </svg>
        </button>
        <div class="app-title-group">
          <img src="/favicon.svg" alt="Sokudo Mark" class="app-logo-mark" width="20" height="20" />
          <span>Hayate</span>
        </div>
      </div>

      <div class="header-right">
        <button id="toggle-right-sidebar-btn" class="btn btn-icon" title="Toggle Explorer & Git Sidebar (Cmd+L / Ctrl+L)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2"/>
            <path d="M15 3v18"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Workspace Split -->
    <div class="app-body">
      <!-- Left Sidebar: Workspaces -->
      <aside id="sidebar" class="app-sidebar">
        <div class="sidebar-header">
          <span>Workspaces</span>
          <button id="add-ws-btn" class="btn btn-icon btn-xs" title="Add workspace">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5v14"/>
            </svg>
          </button>
        </div>

        <div id="workspace-list" class="sidebar-content">
          <!-- Dynamically populated workspace list -->
        </div>
      </aside>

      <div id="sidebar-resizer" class="resize-handle resize-handle-left" title="Drag to resize sidebar (Double click to reset)"></div>

      <!-- Center & Right: Terminal Pane -->
      <main class="app-main">
        <!-- Tabs & Action Bar -->
        <div class="tabs-bar">
          <div id="tabs-container" class="tabs-scroll">
            <!-- Dynamic workbench tabs -->
          </div>

          <!-- New Tab dropdown button -->
          <div class="new-tab-dropdown-wrapper">
            <button id="new-tab-btn" class="btn btn-icon" title="New Tab">
              +
            </button>
            <div id="new-tab-menu" class="dropdown-menu">
              <button class="dropdown-item" data-action="new-terminal">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="4 17 10 11 4 5"/>
                  <line x1="12" y1="19" x2="20" y2="19"/>
                </svg>
                <span>Terminal</span>
              </button>
              <button class="dropdown-item" data-action="new-browser">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="2" y1="12" x2="22" y2="12"/>
                  <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
                <span>Browser</span>
              </button>
              <button class="dropdown-item" data-action="new-markdown">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                  <line x1="16" y1="13" x2="8" y2="13"/>
                  <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                <span>Markdown</span>
              </button>
              <button class="dropdown-item" data-action="new-editor">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="16 18 22 12 16 6"/>
                  <polyline points="8 6 2 12 8 18"/>
                </svg>
                <span>Editor</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Workbench Main Canvas Host (Terminal, Browser, Markdown, Editor) -->
        <div id="terminal-host" class="terminal-host">
          <div id="terminal-empty-notice" class="terminal-empty" style="display: var(--display-none);">
            No active workbench tab. Click + or open a file from Explorer.
          </div>
        </div>
      </main>

      <div id="right-sidebar-resizer" class="resize-handle resize-handle-right" title="Drag to resize panel (Double click to reset)"></div>

      <!-- Right Sidebar: Explorer & Source Control ala Orca -->
      <aside id="right-sidebar" class="right-sidebar">
        <!-- Switcher Bar (Orca style tabs) -->
        <div class="rs-nav">
          <div class="rs-nav-tabs">
            <button id="rs-tab-explorer" class="rs-nav-btn active" data-panel="explorer" title="Files (Cmd+Shift+E)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>
              </svg>
              <span>Files</span>
            </button>
            <button id="rs-tab-search" class="rs-nav-btn" data-panel="search" title="Search (Cmd+Shift+F)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <span>Search</span>
            </button>
            <button id="rs-tab-git" class="rs-nav-btn" data-panel="git" title="Source Control (Cmd+Shift+G)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="18" r="3"/>
                <circle cx="6" cy="6" r="3"/>
                <path d="M18 9a9 9 0 0 1-9 9"/>
                <path d="M6 9v12"/>
              </svg>
              <span>Git</span>
              <span id="rs-git-badge" class="rs-badge" style="display: var(--display-none);">0</span>
            </button>
            </div>
        </div>

        <!-- Explorer Panel -->
        <section id="rs-panel-explorer" class="rs-panel active">
          <div class="rs-panel-header">
            <div class="rs-panel-title">
              <span class="rs-panel-label">EXPLORER</span>
              <span id="rs-ws-name" class="rs-subtext" title="Active workspace">-</span>
            </div>
            <div class="rs-panel-actions">
              <button id="rs-explorer-new-file" class="btn btn-icon btn-xs" title="New File">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                  <line x1="12" y1="18" x2="12" y2="12"/>
                  <line x1="9" y1="15" x2="15" y2="15"/>
                </svg>
              </button>
              <button id="rs-explorer-new-folder" class="btn btn-icon btn-xs" title="New Folder">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                  <line x1="12" y1="11" x2="12" y2="17"/>
                  <line x1="9" y1="14" x2="15" y2="14"/>
                </svg>
              </button>
              <button id="rs-explorer-refresh" class="btn btn-icon btn-xs" title="Refresh">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                  <path d="M3 3v5h5"/>
                  <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                  <path d="M16 16h5v5"/>
                </svg>
              </button>
              <button id="rs-explorer-collapse-all" class="btn btn-icon btn-xs" title="Collapse All Folders">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="4 7 4 4 20 4 20 7"/>
                  <line x1="9" y1="20" x2="15" y2="20"/>
                  <line x1="12" y1="4" x2="12" y2="20"/>
                </svg>
              </button>
            </div>
          </div>
          <!-- Open Editors Section Accordion -->
          

          <!-- Explorer Tree Filter Bar (Cmd+F) -->
          <div id="rs-tree-filter-bar" class="rs-tree-filter-bar is-hidden">
            <input
              type="text"
              id="rs-tree-filter-input"
              class="rs-tree-filter-input"
              placeholder="Filter by name..."
              spellcheck="false"
              autocomplete="off"
            />
            <span id="rs-tree-filter-badge" class="rs-tree-filter-badge"></span>
            <button id="rs-tree-filter-close" class="rs-tree-filter-close" title="Clear and close filter (Esc)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>

          <div id="rs-files-tree" class="rs-panel-body rs-files-list">
            <div class="rs-empty">Select a workspace to view files</div>
          </div>

          <!-- Open Editors at bottom -->
          <div id="rs-open-editors" class="rs-open-editors-section"></div>
        </section>

        <!-- Search Panel (VS Code Viewlet standard) -->
        <section id="rs-panel-search" class="rs-panel">
          <div class="rs-panel-header">
            <div class="rs-panel-title">
              <span class="rs-panel-label">SEARCH</span>
              <span id="rs-search-count-badge" class="rs-badge" style="display: var(--display-none);">0</span>
            </div>
            <div class="rs-panel-actions">
              <button id="rs-search-refresh" class="btn btn-icon btn-xs" title="Refresh search">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                  <path d="M3 3v5h5"/>
                  <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                  <path d="M16 16h5v5"/>
                </svg>
              </button>
              <button id="rs-search-clear" class="btn btn-icon btn-xs" title="Clear search">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"/>
                  <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="rs-search-inputs">
            <div class="rs-search-row">
              <div class="rs-search-input-box">
                <input
                  id="rs-search-query"
                  type="text"
                  class="rs-search-input"
                  placeholder="Search files or content... (Enter)"
                  spellcheck="false"
                  autocomplete="off"
                />
                <div class="rs-search-modifiers">
                  <button id="rs-search-case" class="rs-search-btn" title="Match Case (Alt+C)">Aa</button>
                  <button id="rs-search-word" class="rs-search-btn" title="Match Whole Word (Alt+W)">\b</button>
                  <button id="rs-search-regex" class="rs-search-btn" title="Use Regular Expression (Alt+R)">.*</button>
                </div>
              </div>
            </div>
            <div id="rs-search-include-wrap" class="rs-search-row is-hidden">
              <div class="rs-search-input-box">
                <input
                  id="rs-search-include"
                  type="text"
                  class="rs-search-input"
                  placeholder="files to include (e.g. *.ts, src/)"
                  spellcheck="false"
                />
              </div>
            </div>
          </div>
          <div id="rs-search-results" class="rs-panel-body rs-search-results">
            <div class="rs-search-msg">Type a query to search across files</div>
          </div>
        </section>

        <!-- Source Control Panel -->
        <section id="rs-panel-git" class="rs-panel">
          <div class="rs-panel-header">
            <div class="rs-panel-title">
              <span class="rs-panel-label">SOURCE CONTROL</span>
              <span id="rs-git-branch" class="rs-branch-pill" title="Git Branch">-</span>
            </div>
            <div class="rs-panel-actions">
              <button id="rs-git-refresh" class="btn btn-icon btn-xs" title="Refresh git status">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                  <path d="M3 3v5h5"/>
                  <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                  <path d="M16 16h5v5"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Commit Box -->
          <div class="rs-commit-box">
            <textarea
              id="rs-commit-msg"
              class="rs-commit-input"
              rows="2"
              placeholder="Commit message (Ctrl+Enter to commit)..."
              spellcheck="false"
            ></textarea>
            <div class="rs-commit-actions">
              <label class="rs-commit-opt" title="Stage all modified and untracked files before commit">
                <input type="checkbox" id="rs-commit-stage-all" checked />
                <span>Stage All</span>
              </label>
              <button id="rs-commit-btn" class="btn btn-xs">Commit</button>
            </div>
          </div>

          <div id="rs-git-groups" class="rs-panel-body rs-git-groups">
            <div class="rs-empty">No git changes</div>
          </div>

          <!-- Commit History Section -->
          <div id="rs-git-commits-section" class="rs-git-section rs-commits-section collapsed">
            <div class="rs-git-section-title" id="rs-commits-title">
              <span class="rs-git-section-label">
                <span class="rs-git-chevron"><svg class="rs-chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
                <span>Commits</span>
              </span>
              <span id="rs-commits-count" class="rs-badge">0</span>
            </div>
            <div id="rs-git-commits-list" class="rs-git-section-body rs-commits-list">
              <div class="rs-empty">Loading commits...</div>
            </div>
          </div>
        </section>

        <!-- Search in Files Panel -->
        
      </aside>
    </div>

    <!-- File Viewer Modal -->
    <div id="rs-preview-modal" class="rs-modal" style="display: var(--display-none);">
      <div class="rs-modal-overlay"></div>
      <div class="rs-modal-window">
        <div class="rs-modal-header">
          <div class="rs-modal-title">
            <span id="rs-preview-title">File Preview</span>
            <span id="rs-preview-size" class="rs-badge"></span>
          </div>
          <button id="rs-preview-close" class="btn btn-icon btn-xs" title="Close modal">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="rs-modal-body">
          <pre id="rs-preview-code"><code></code></pre>
        </div>
      </div>
    </div>
  </div>

  <!-- Local Vendor Scripts -->
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/vendor/prism.js"></script>
  <!-- Main Application Script -->
  <script type="module" src="/js/index.js"></script>
</body>
</html>
